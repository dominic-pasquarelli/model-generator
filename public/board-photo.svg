<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660">
  <!-- Fictional generic dev board "MG-DEV-01" photographed on a desk.
       Original artwork for Model Generator mockups. Not a real product. -->
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#75675a"/>
      <stop offset="0.55" stop-color="#665949"/>
      <stop offset="1" stop-color="#57493c"/>
    </linearGradient>
    <linearGradient id="mask" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#1c7a50"/>
      <stop offset="0.5" stop-color="#166746"/>
      <stop offset="1" stop-color="#115a3c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="usb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6eaee"/>
      <stop offset="0.2" stop-color="#b9c2ca"/>
      <stop offset="0.55" stop-color="#98a2ab"/>
      <stop offset="1" stop-color="#7c858e"/>
    </linearGradient>
    <radialGradient id="cap" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#d8dde2"/>
      <stop offset="0.65" stop-color="#aab2ba"/>
      <stop offset="1" stop-color="#7e8790"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.28"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.6 0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <filter id="boardshadow" x="-6%" y="-8%" width="112%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1a130d" flood-opacity="0.55"/>
    </filter>
    <g id="pinpair">
      <rect x="-8" y="-8" width="16" height="16" fill="#141618"/>
      <rect x="-4.5" y="-4.5" width="9" height="9" fill="#d9b544"/>
      <rect x="-8" y="17" width="16" height="16" fill="#141618"/>
      <rect x="-4.5" y="20.5" width="9" height="9" fill="#c7a538"/>
    </g>
    <g id="r0603">
      <rect x="-9" y="-5" width="18" height="10" rx="1.5" fill="#2e2723"/>
      <rect x="-9" y="-5" width="4.5" height="10" fill="#b9c2ca"/>
      <rect x="4.5" y="-5" width="4.5" height="10" fill="#b9c2ca"/>
      <rect x="-4" y="-4" width="8" height="8" fill="#3d3126"/>
    </g>
    <g id="c0603">
      <rect x="-9" y="-5" width="18" height="10" rx="1.5" fill="#b98d5a"/>
      <rect x="-9" y="-5" width="4.5" height="10" fill="#cdd4da"/>
      <rect x="4.5" y="-5" width="4.5" height="10" fill="#cdd4da"/>
    </g>
    <g id="mount-hole">
      <circle r="31" fill="#c3cad1"/>
      <circle r="31" fill="none" stroke="#8d959d" stroke-width="2"/>
      <circle r="16" fill="#41372e"/>
      <circle r="16" fill="none" stroke="#2b241e" stroke-width="3"/>
      <circle cx="-7" cy="-8" r="12" fill="#ffffff" opacity="0.14"/>
    </g>
  </defs>

  <!-- desk -->
  <rect width="1000" height="660" fill="url(#desk)"/>
  <g opacity="0.5">
    <path d="M0 90 Q 500 78 1000 96" stroke="#4e4236" stroke-width="3" fill="none" opacity="0.5"/>
    <path d="M0 300 Q 520 288 1000 304" stroke="#4e4236" stroke-width="2.5" fill="none" opacity="0.4"/>
    <path d="M0 520 Q 480 508 1000 526" stroke="#4e4236" stroke-width="3" fill="none" opacity="0.45"/>
    <path d="M0 180 Q 540 172 1000 186" stroke="#7c6d5c" stroke-width="2" fill="none" opacity="0.4"/>
    <path d="M0 430 Q 470 420 1000 436" stroke="#7c6d5c" stroke-width="2" fill="none" opacity="0.35"/>
  </g>

  <!-- board -->
  <g filter="url(#boardshadow)">
    <rect x="75" y="50" width="850" height="560" rx="26" fill="url(#mask)"/>
  </g>
  <rect x="75" y="50" width="850" height="560" rx="26" fill="none" stroke="#d3bd84" stroke-width="3" opacity="0.5"/>
  <rect x="81" y="56" width="838" height="548" rx="22" fill="none" stroke="#0c4a30" stroke-width="4" opacity="0.6"/>

  <!-- ground pour tone -->
  <g opacity="0.35">
    <rect x="95" y="180" width="220" height="400" rx="14" fill="#0e5138"/>
    <rect x="520" y="70" width="380" height="150" rx="14" fill="#0e5138"/>
    <rect x="330" y="450" width="330" height="140" rx="14" fill="#0e5138"/>
  </g>

  <!-- traces -->
  <g fill="none" stroke="#2c9a68" stroke-width="4" opacity="0.5" stroke-linecap="round">
    <path d="M340 300 L 250 300 L 210 260 L 210 160"/>
    <path d="M340 330 L 240 330 L 200 370 L 200 470"/>
    <path d="M500 300 L 640 300 L 680 260 L 830 260"/>
    <path d="M500 330 L 650 330 L 690 370 L 830 370"/>
    <path d="M500 360 L 620 360 L 660 400 L 660 445"/>
    <path d="M420 260 L 420 190 L 450 160 L 450 150"/>
    <path d="M380 260 L 380 200 L 350 170 L 350 150"/>
    <path d="M480 420 L 480 480 L 520 520 L 620 520"/>
    <path d="M360 420 L 360 470 L 320 510 L 240 510"/>
  </g>
  <g fill="#2c9a68" opacity="0.55">
    <circle cx="210" cy="160" r="7"/><circle cx="200" cy="470" r="7"/>
    <circle cx="660" cy="445" r="7"/><circle cx="240" cy="510" r="7"/><circle cx="620" cy="520" r="7"/>
  </g>

  <!-- 2x20 pin header along top edge -->
  <g>
    <rect x="190" y="96" width="510" height="62" rx="6" fill="#17191c"/>
    <rect x="190" y="96" width="510" height="10" rx="5" fill="#26292d"/>
    <g>
      <use href="#pinpair" x="205" y="112"/><use href="#pinpair" x="230" y="112"/><use href="#pinpair" x="255" y="112"/><use href="#pinpair" x="280" y="112"/><use href="#pinpair" x="305" y="112"/><use href="#pinpair" x="330" y="112"/><use href="#pinpair" x="355" y="112"/><use href="#pinpair" x="380" y="112"/><use href="#pinpair" x="405" y="112"/><use href="#pinpair" x="430" y="112"/><use href="#pinpair" x="455" y="112"/><use href="#pinpair" x="480" y="112"/><use href="#pinpair" x="505" y="112"/><use href="#pinpair" x="530" y="112"/><use href="#pinpair" x="555" y="112"/><use href="#pinpair" x="580" y="112"/><use href="#pinpair" x="605" y="112"/><use href="#pinpair" x="630" y="112"/><use href="#pinpair" x="655" y="112"/><use href="#pinpair" x="680" y="112"/>
    </g>
  </g>
  <text x="190" y="182" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e8f2ea" opacity="0.85">J1</text>

  <!-- SoC -->
  <g>
    <rect x="336" y="256" width="168" height="168" rx="8" fill="#101215"/>
    <rect x="336" y="256" width="168" height="20" rx="8" fill="#1c2025"/>
    <rect x="344" y="264" width="152" height="152" rx="5" fill="none" stroke="#2a2f36" stroke-width="2"/>
    <circle cx="360" cy="404" r="7" fill="#3a4048"/>
    <text x="420" y="330" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="19" fill="#9aa4ae">MG1042</text>
    <text x="420" y="356" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#6c757e">B2419-EG</text>
    <g stroke="#b9c2ca" stroke-width="4" opacity="0.9">
      <path d="M348 244 v-10 M368 244 v-10 M388 244 v-10 M408 244 v-10 M428 244 v-10 M448 244 v-10 M468 244 v-10 M488 244 v-10"/>
      <path d="M348 436 v10 M368 436 v10 M388 436 v10 M408 436 v10 M428 436 v10 M448 436 v10 M468 436 v10 M488 436 v10"/>
      <path d="M324 268 h-10 M324 288 h-10 M324 308 h-10 M324 328 h-10 M324 348 h-10 M324 368 h-10 M324 388 h-10 M324 408 h-10"/>
      <path d="M516 268 h10 M516 288 h10 M516 308 h10 M516 328 h10 M516 348 h10 M516 368 h10 M516 388 h10 M516 408 h10"/>
    </g>
  </g>
  <text x="336" y="470" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e8f2ea" opacity="0.85">U3</text>

  <!-- USB-A connector, right edge (overhangs board edge) -->
  <g>
    <rect x="806" y="246" width="140" height="168" rx="10" fill="url(#usb)"/>
    <rect x="806" y="246" width="140" height="168" rx="10" fill="none" stroke="#5f6870" stroke-width="2.5"/>
    <rect x="920" y="262" width="26" height="136" rx="5" fill="#20242a"/>
    <rect x="920" y="276" width="16" height="108" fill="#0d0f12"/>
    <g stroke="#6d757d" stroke-width="2" opacity="0.8">
      <path d="M818 258 l20 -8 M818 402 l20 8"/>
    </g>
    <circle cx="846" cy="286" r="6" fill="#585f66"/>
    <circle cx="846" cy="374" r="6" fill="#585f66"/>
    <rect x="812" y="300" width="14" height="60" rx="4" fill="#818a92"/>
  </g>
  <text x="806" y="440" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e8f2ea" opacity="0.85">J4</text>

  <!-- electrolytic cap -->
  <g>
    <circle cx="700" cy="490" r="42" fill="url(#cap)"/>
    <circle cx="700" cy="490" r="42" fill="none" stroke="#666f77" stroke-width="2.5"/>
    <path d="M700 452 v76 M666 483 l34 -20 34 20" stroke="#7d868e" stroke-width="3.5" fill="none"/>
    <rect x="676" y="446" width="12" height="88" fill="#31363b" opacity="0.25" transform="rotate(24 700 490)"/>
  </g>
  <text x="748" y="524" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e8f2ea" opacity="0.85">C7</text>

  <!-- crystal -->
  <rect x="540" y="228" width="64" height="30" rx="14" fill="#c3cad1" stroke="#7e868e" stroke-width="2"/>
  <text x="542" y="220" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#e8f2ea" opacity="0.8">Y1</text>

  <!-- passives -->
  <use href="#r0603" x="260" y="210"/>
  <use href="#c0603" x="300" y="210"/>
  <use href="#r0603" x="560" y="300"/>
  <use href="#c0603" x="560" y="336"/>
  <use href="#r0603" x="250" y="420" transform="rotate(90 250 420)"/>
  <use href="#c0603" x="285" y="420" transform="rotate(90 285 420)"/>
  <use href="#r0603" x="620" y="180"/>
  <use href="#c0603" x="660" y="180"/>
  <use href="#r0603" x="430" y="500"/>
  <use href="#c0603" x="470" y="500"/>
  <use href="#r0603" x="180" y="300" transform="rotate(90 180 300)"/>

  <!-- silkscreen -->
  <g fill="#eef6f0">
    <text x="170" y="596" font-family="DejaVu Sans Mono, monospace" font-size="22" opacity="0.92">MG-DEV-01</text>
    <text x="322" y="596" font-family="DejaVu Sans Mono, monospace" font-size="16" opacity="0.7">rev B</text>
    <text x="560" y="596" font-family="DejaVu Sans Mono, monospace" font-size="14" opacity="0.6">FICTIONAL SAMPLE BOARD</text>
  </g>
  <g fill="none" stroke="#eef6f0" stroke-width="2.5" opacity="0.55">
    <rect x="330" y="250" width="180" height="180" rx="10"/>
    <path d="M195 92 h500"/>
    <circle cx="700" cy="490" r="48"/>
  </g>

  <!-- mounting holes -->
  <use href="#mount-hole" x="110" y="85"/>
  <use href="#mount-hole" x="890" y="85"/>
  <use href="#mount-hole" x="110" y="575"/>
  <use href="#mount-hole" x="890" y="575"/>

  <!-- photo shine + vignette + grain -->
  <rect x="75" y="50" width="850" height="560" rx="26" fill="url(#shine)"/>
  <rect width="1000" height="660" fill="url(#vign)"/>
  <rect width="1000" height="660" filter="url(#grain)" opacity="0.05"/>
</svg>
