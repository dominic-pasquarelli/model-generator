name: CI

# Enforces the verification set the PR claims (typecheck, unit tests, production build,
# Playwright against that build, and the documentation audit) on the exact reviewed commit,
# from a frozen lockfile, so results are reproducible rather than self-reported.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python (doc-audit)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests (production build)
        run: pnpm test:e2e

      - name: Documentation audit
        run: |
          python3 tools/doc-audit/doc_audit.py --check
          python3 -m unittest discover tools/doc-audit/tests
